<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Test List</title>
  <link rel="stylesheet" th:href="@{/resources/css/template.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/testList.css}" />
  <link rel="stylesheet" th:href="@{/libs/fontawesome/css/all.min.css}">
  <link rel="icon" type="image/png" th:href="@{/resources/icons/icon.png}" />
</head>

<body>
  <header th:replace="../fragments/template :: header"></header>
  <!-- search bar -->
  <div class="InputContainer">
    <input
            placeholder="Search"
            id="input"
            class="input"
            name="text"
            type="text"
    />

    <label class="labelforsearch" for="input">
      <i class="fa-solid fa-magnifying-glass searchIcon"></i>
    </label>
  </div>
  <div class="search-results">
    <span class="results-count" id="resultsCount"></span>
  </div>

  <main>
    <h2>These are your tests</h2>

    <div class="tests-list" th:if="${errorMessage == null}">
      <ul id="tests">
        <li class="test-item" th:each="test: ${tests}" th:id="${'test_' + test.id}">
          <a class="test-link cta-btn" th:href="@{'/test?id=' + ${test.id}}">
            <span class="name">[[${test.name}]]</span>
          </a>
          <span>Description:</span>
          <span class="description">[[${test.description}]]</span>
          <a class="cta-btn" th:href="@{'/executionCreate?id=' + ${test.id}}">
            <i class="fa-solid fa-play"></i>
          </a>
        </li>
      </ul>
    </div>

    <div class="error" th:if="${errorMessage != null}">
      <h3 class="error-message" th:text="${errorMessage}"></h3>
      <a class="cta-btn" th:href="@{/}">Return to home page</a>
    </div>
  </main>

  <footer th:replace="../fragments/template :: footer"></footer>
  <script th:src="@{/resources/js/testList.js}"></script>
</body>
</html>
